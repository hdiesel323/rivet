    <text x="620" y="161" text-anchor="middle">Anthropic OAuth</text>
    <rect x="540" y="194" width="160" height="48" rx="6" fill="#fffdf8" stroke="#d9d0c3"/>
    <text x="620" y="223" text-anchor="middle">Google OAuth</text>
    <rect x="540" y="256" width="160" height="48" rx="6" fill="#fffdf8" stroke="#1c1916"/>
