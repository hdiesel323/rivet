  <text x="120" y="36" font-family="ui-sans-serif, system-ui" font-size="13" fill="#6f675d">one door · optional classifier · ledger with memory</text>
  <rect x="40" y="70" width="140" height="64" rx="6" fill="#fffdf8" stroke="#1c1916"/>
  <text x="110" y="107" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="13" fill="#1c1916">Your app</text>
  <path d="M180 102 H250" stroke="#c45c26" stroke-width="2"/>
  <rect x="250" y="58" width="220" height="280" rx="8" fill="#1c1916"/>
  <text x="360" y="88" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="12" fill="#f4efe6" letter-spacing="2">ORCHESTRATOR</text>
  <rect x="270" y="108" width="180" height="44" rx="4" fill="#c45c26"/>
  <text x="360" y="135" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="12" fill="#fffdf8">classifier slot</text>
  <text x="360" y="168" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="11" fill="#d9d0c3">jev · other · rules · none</text>
  <rect x="270" y="188" width="180" height="44" rx="4" fill="#fffdf8"/>
  <text x="360" y="215" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="12" fill="#1c1916">policy + cache</text>
  <rect x="270" y="248" width="180" height="44" rx="4" fill="#efe8dc"/>
  <text x="360" y="275" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="12" fill="#1c1916">token ledger</text>
  <text x="360" y="318" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="11" fill="#d9d0c3">rivet_usd = 0</text>
  <path d="M470 102 H540" stroke="#c45c26" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui" font-size="13" fill="#1c1916">
    <rect x="540" y="70" width="160" height="48" rx="6" fill="#fffdf8" stroke="#d9d0c3"/>
