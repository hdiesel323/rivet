name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Server tests
        working-directory: app/server
        run: |
          uv sync --all-extras
          uv run pytest -q
      - name: Client build
        working-directory: app/client
        run: |
          npm install
          npm run build
